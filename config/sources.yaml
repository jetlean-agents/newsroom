    FACT-338 (2026-11-09): rada_news_uk понижен verified -> candidate (пустой канал,
    регрессия с 2026-11-07/08). Добавлены 3 новых verified facts-источника:
    ccu_gov_ua_rss (polityka/podii, закрывает регрессию rada_news_uk),
    icrc_general_rss (viina), ui_org_ua_rss (kultura). zdorovia/sport/rehiony остаются
    с 1 facts-источником — второй официальный первоисточник не найден живым запросом
    в этом прогоне (см. docs/sources/registry.md, раздел «Аудит и обновление реестра»).
  note: >
    72 источника со статусом verified прошли проверку живым запросом в этом прогоне
    (curl -A "<Chrome/131 UA>" -L -m 15, с Contabo, НЕ WebFetch) 2026-11-08 — HTTP 200,
    корректный формат (RSS/Atom/JSON) И реальные items (>0) в канале. Все 12 рубрик покрыты
    минимум 4 verified-источниками, у всех есть хотя бы 1 facts-источник. Рубрика sport закрыта
    facts-источником upl.ua (Українська Прем'єр-Ліга, официальный организатор чемпионата) —
    добавлено по решению PO 2026-11-08; worldathletics.org/rss проверен и НЕ добавлен (живой
    фид, но последние записи 2022 года — не актуальный канал); платный агрегатор спортивных
    результатов по решению PO НЕ подключаем.
    TASS (tass.com) технически отдал 200, но не включён ни в verified, ни в candidates:
    российское государственное пропагандистское издание — неприемлемо для украинской
    аудитории по редакционной политике, а не из-за технической проверки.

# Dokploy sandbox app (news-media.bigear.uk): this project's own S3-compatible
# media storage (MinIO), separate from `docker-compose.yml` (FACT-170) for the
# same reason Avto-traffic split Umami into its own compose app — routing two
# domains to two different services inside one Dokploy compose app has
# reproducibly 502'd (see jetlean-agents/avto-traffic docs/deploy.md). `app`/
# `worker` reach this over its public URL (`S3_ENDPOINT`/`S3_PUBLIC_URL`), not
# a cross-compose-project internal network.
services:
  minio:
    image: minio/minio:latest
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - newsroom_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    mem_limit: 128m
    cpus: 0.25
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      (mc mb -p local/\"$$S3_BUCKET\" || true) &&
      mc anonymous set download local/\"$$S3_BUCKET\"
      "

volumes:
  newsroom_minio_data:

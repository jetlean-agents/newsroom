name: ag-fact-170

# Dokploy sandbox app (news.bigear.uk): app + worker + this app's OWN Postgres.
# Fully isolated from Contabo/dev — no shared Postgres, no Tailscale addresses
# in env (see repo CLAUDE.md "Окружения: dev / stage / prod"). Media (S3) lives
# in the separate `docker-compose.minio.yml` compose app — see docs/deploy.md
# for why it's split out instead of a second domain in this same compose app.
#
# No host ports are published: Dokploy/Traefik routes `news.bigear.uk` to the
# `app` service's internal port 3000 via the Dokploy domain config, not via a
# compose `ports:` mapping (there is no stable host IP to bind to on the
# Dokploy host). Local day-to-day dev still uses `npm run dev` against the
# shared Contabo Postgres (`docs/deploy.md` "Dev"), not this compose file.
services:
  app:
    build: .
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://newsroom:${POSTGRES_PASSWORD}@db:5432/newsroom
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      SITE_URL: ${SITE_URL}
      SITE_NAME: ${SITE_NAME}
      NOINDEX: "true"
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      TAG_NOINDEX_THRESHOLD: ${TAG_NOINDEX_THRESHOLD:-30}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: auto
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      AUTOREG_API_URL: ${AUTOREG_API_URL:-}
      AUTOREG_SERVICE_TOKEN: ${AUTOREG_SERVICE_TOKEN:-}
      AUTOREG_SITE_SLUG: ${AUTOREG_SITE_SLUG:-}
      AUTOREG_SECRET_ID: ${AUTOREG_SECRET_ID:-}
      AUTOREG_KEY_TTL_SECONDS: ${AUTOREG_KEY_TTL_SECONDS:-3600}
      AI_SPEND_LIMIT_USD: ${AI_SPEND_LIMIT_USD:-10}
      AI_SPEND_PERIOD: ${AI_SPEND_PERIOD:-week}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["npm", "run", "worker"]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://newsroom:${POSTGRES_PASSWORD}@db:5432/newsroom
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: auto
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      INGEST_ENABLED: "true"
      INGEST_INCLUDE_CANDIDATES: "false"
      EVENT_CONFIRMATION_MIN_SOURCES: ${EVENT_CONFIRMATION_MIN_SOURCES:-2}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_API_KEY: ${AI_API_KEY:-}
      AUTOREG_API_URL: ${AUTOREG_API_URL:-}
      AUTOREG_SERVICE_TOKEN: ${AUTOREG_SERVICE_TOKEN:-}
      AUTOREG_SITE_SLUG: ${AUTOREG_SITE_SLUG:-}
      AUTOREG_SECRET_ID: ${AUTOREG_SECRET_ID:-}
      AUTOREG_KEY_TTL_SECONDS: ${AUTOREG_KEY_TTL_SECONDS:-3600}
      AI_SPEND_LIMIT_USD: ${AI_SPEND_LIMIT_USD:-10}
      AI_SPEND_PERIOD: ${AI_SPEND_PERIOD:-week}
      AUTO_PUBLISH: ${AUTO_PUBLISH:-false}
      ORIGINALITY_MAX_OVERLAP: ${ORIGINALITY_MAX_OVERLAP:-0.5}
      DRAFTS_PER_DAY: ${DRAFTS_PER_DAY:-20}
    depends_on:
      db:
        condition: service_healthy

  seed:
    # One-shot: no Dokploy exec/SSH access to this host, so this is the only way to
    # run `npm run seed` against the stage DB — including rotating the admin/editor/
    # author passwords (FACT-170 PO review, twice: editor can publish/unpublish and
    # edit rubrics/tags/pages just like admin, so it got the same treatment): re-
    # running this service with new SEED_ADMIN_PASSWORD/SEED_DEMO_PASSWORD values
    # updates the existing accounts to match. Safe to leave in the compose file
    # long-term — `restart: "no"` means it only runs once per `docker compose
    # up`/redeploy, and demo content creation past the users section still fails
    # loudly (exit 1) on a re-run's duplicate rubrics/articles rather than
    # duplicating them — but that's after the password rotations above it have
    # already applied.
    build: .
    # migrate first (idempotent, race-safe against `app`'s own startup migrate) —
    # seed needs the schema to exist and can start before `app` has migrated it.
    command: ["sh", "-c", "npm run migrate && npm run seed"]
    mem_limit: 256m
    cpus: 0.5
    restart: "no"
    environment:
      DATABASE_URL: postgres://newsroom:${POSTGRES_PASSWORD}@db:5432/newsroom
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: newsroom
    volumes:
      - newsroom_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Internal-only — no published port, no domain. This project's own
    # Postgres (never the shared Contabo `platform-postgres-1`).

volumes:
  newsroom_pg_data:

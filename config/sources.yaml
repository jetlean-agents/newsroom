# Реестр источников для ingestion (FACT-167, расширено FACT-235)
#
# Контракт полей для Developer-задачи ingestion (stage 2):
#   id               — уникальный slug
#   name             — человекочитаемое имя
#   type             — rss | api | press
#   status           — verified  = проверено живым запросом (curl, Chrome UA, с Contabo) в этом прогоне,
#                                   код ответа 200 + корректный формат (RSS/Atom/JSON) + реальные <item>/<entry>
#                                   (не пустой канал) — идёт в автополлинг
#                       candidate = фид не отвечает 200 нашему curl (антибот/Cloudflare/Radware/404/403),
#                                   или отдаёт 200 с пустым каналом (0 items), или формат подтверждён,
#                                   но условия реюза не подтверждены — в автополлинг НЕ идёт
#   url              — URL фида/API
#   language         — uk | en | ru | multi
#   usage            — signal = коммерческое/независимое медиа: берём заголовок, ссылку и короткий анонс
#                                только чтобы узнать о событии и кластеризовать его; текст/фото не храним
#                                и не переписываем — материал пишется по фактам из первоисточников
#                       facts  = официальный первоисточник (госорган/регулятор/международная организация/
#                                пресс-релиз компании о себе/открытые данные) — можно цитировать и приводить
#                                данные с атрибуцией
#   rubrics          — список slug'ов рубрик общей ленты (FACT-194): podii, polityka, viina, ekonomika,
#                       groshi, svit, suspilstvo, tekhnolohii, zdorovia, sport, kultura, rehiony.
#                       Источник может покрывать несколько рубрик, если его реальный контент это подтверждает.
#   region           — natsional (национальный источник) | slug области/города (lviv, kharkiv, odesa,
#                       dnipro, zaporizhzhia, kryvyi_rih, vinnytsia, zhytomyr, ternopil, chernihiv,
#                       rivne, sumy, kherson, mykolaiv, chernivtsi, kyiv) — для региональных источников
#   topics           — список тем (англ., для совместимости с текущим контрактом worker'а)
#   terms_url        — страница с условиями использования / лицензией
#   reuse_terms      — что конкретно разрешено
#   attribution_required — true/false
#   rate_limit       — ограничение на частоту запросов (если применимо)
#   poll_interval    — рекомендуемый интервал опроса
#   robots_ok        — true | false | not_applicable (+ причина в notes, если false)
#   last_verified    — дата проверки живым запросом в ЭТОМ прогоне: 2026-11-08 (curl -A "<Chrome UA>" -L -m 15, с Contabo)
#   notes            — HTTP-код, content-type, количество items, оговорки, эскалации
#
# 85 источников проверены живым curl 2026-11-08 (Chrome/131 UA, -L -m 15, FACT-235). У verified
# дополнительно проверено количество <item>/<entry> > 0 (несколько фидов отдавали HTTP 200 с
# валидным content-type, но 0 items — такие остались в candidate или не включены вовсе, см. notes
# конкретных источников). FACT-338 (2026-11-09): +3 новых источника, rada_news_uk понижен
# verified -> candidate (пустой канал) — текущий итог 88 источников (74 verified + 14 candidate),
# см. sources_summary в конце файла и docs/sources/registry.md.

sources:

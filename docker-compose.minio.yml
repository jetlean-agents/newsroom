# Dokploy sandbox app (news-media.bigear.uk): this project's own S3-compatible
# media storage (MinIO), separate from `docker-compose.yml` (FACT-170) for the
# same reason Avto-traffic split Umami into its own compose app — routing two
# domains to two different services inside one Dokploy compose app has
# reproducibly 502'd (see jetlean-agents/avto-traffic docs/deploy.md). `app`/
# `worker` reach this over its public URL (`S3_ENDPOINT`/`S3_PUBLIC_URL`), not
# a cross-compose-project internal network.
#
# Images: `minio/minio` and `minio/mc` are gone from Docker Hub (MinIO retired
# them) and `quay.io/minio/*` now rejects anonymous pulls (401 on the token
# exchange, verified directly) — both would fail here with no useful build
# log (FACT-170: a Dokploy compose deploy that can't pull its image errors in
# ~2s with an empty log, easy to mistake for a config/validation bug). Using
# Rancher's verbatim mirror of the same official binaries instead
# (`rancher/mirrored-minio-*`, pinned release tags) — swap back to
# `minio/minio`/`minio/mc` if/when they're restored.
services:
  minio:
    image: rancher/mirrored-minio-minio:RELEASE.2023-07-07T07-13-57Z
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - newsroom_minio_data:/data
    healthcheck:
      # No `mc` in this image — hit MinIO's own liveness endpoint instead.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  createbuckets:
    image: rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
    mem_limit: 128m
    cpus: 0.25
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      (mc mb -p local/\"$$S3_BUCKET\" || true) &&
      mc anonymous set download local/\"$$S3_BUCKET\"
      "

volumes:
  newsroom_minio_data:
